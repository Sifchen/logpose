[project]
name = "api"
version = "0.1.0"
readme = "README.md"
requires-python = ">=3.12"
authors = [
    { name = "Daniel", email = "daniel.pigotow@outlook.de" }
]
dependencies = [
    "alembic>=1.20.1",
    "fastapi>=0.162.0",
    "httpx2>=2.16.0",
    "psycopg[binary]>=3.3.8",
    "sqlalchemy>=2.1.8",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff.lint.isort]
known-third-party = ["alembic"]
