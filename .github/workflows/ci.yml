name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.0.1

      - uses: actions/setup-node@v5
        with:
          node-version: '24'

      - run: npm ci
        working-directory: web

      - run: make lint

      - run: make test
      
      - run: make build